name: Build Android APK

on:
  push:
    branches: [main, dev]
    tags: ["v*"]
    paths-ignore: &non_code_paths
      - "**/*.md"
      - "assets/**"
      - "screenshots/**"
      - "LICENSE"
      - ".github/ISSUE_TEMPLATE/**"
      - ".github/PULL_REQUEST_TEMPLATE.md"
  pull_request:
    branches: [main, dev]
    paths-ignore: *non_code_paths
  workflow_dispatch:

concurrency:
  group: android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

permissions:
  contents: write

defaults:
  run:
    shell: bash

jobs:
  verify:
    name: Lint and Debug Build
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Make Gradle executable
        run: chmod +x ./gradlew

      - name: Run lint, unit tests, and assemble debug APK
        run: ./gradlew --no-daemon --stacktrace testDebugUnitTest assembleDebug

      - name: Prepare and Rename Debug APK
        run: |
          VERSION_NAME=$(grep 'versionName = ' app/build.gradle.kts | head -n 1 | cut -d'"' -f2)
          if [ -z "$VERSION_NAME" ]; then
            VERSION_NAME="1.0"
          fi
          mkdir -p debug-dist
          if [ -f "app/build/outputs/apk/debug/app-debug.apk" ]; then
            cp "app/build/outputs/apk/debug/app-debug.apk" "debug-dist/AttendSmartly-v${VERSION_NAME}-debug.apk"
          fi

      - name: Upload debug APK
        if: ${{ github.event_name == 'pull_request' || github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/main' }}
        uses: actions/upload-artifact@v4
        with:
          name: AttendSmartly-Debug-apk
          path: debug-dist/*.apk
          if-no-files-found: error
          retention-days: 14

  release:
    name: Build Signed Release
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.ref == 'refs/heads/main' ||
      startsWith(github.ref, 'refs/tags/v')
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Make Gradle executable
        run: chmod +x ./gradlew

      - name: Setup Keystore for Release Signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "${RUNNER_TEMP}/my-upload-key.jks"
          fi

      - name: Build Release APK
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/my-upload-key.jks
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew --no-daemon assembleRelease

      - name: Determine Version & Package Release APK
        id: version_info
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            TAG_NAME="${{ github.ref_name }}"
            APP_VERSION="${TAG_NAME#v}"
          else
            GRADLE_VERSION=$(grep 'versionName = ' app/build.gradle.kts | head -n 1 | cut -d'"' -f2)
            if [ -z "$GRADLE_VERSION" ]; then
              GRADLE_VERSION="1.0"
            fi
            APP_VERSION="${GRADLE_VERSION}"
            TAG_NAME="v${APP_VERSION}"
          fi

          echo "APP_VERSION=${APP_VERSION}" >> $GITHUB_OUTPUT
          echo "TAG_NAME=${TAG_NAME}" >> $GITHUB_OUTPUT

          mkdir -p dist
          for apk in app/build/outputs/apk/release/*.apk; do
            if [ -f "$apk" ]; then
              cp "$apk" "dist/AttendSmartly-v${APP_VERSION}.apk"
            fi
          done
          echo "Created Release APKs in dist/:"
          ls -la dist/

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AttendSmartly-Release-apk
          path: dist/*.apk
          if-no-files-found: warn
          retention-days: 30

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.apk
          tag_name: ${{ steps.version_info.outputs.TAG_NAME }}
          name: AttendSmartly ${{ steps.version_info.outputs.TAG_NAME }}
          generate_release_notes: true
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
